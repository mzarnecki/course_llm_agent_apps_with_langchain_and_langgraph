[project]
name = "course-llm-langchain-langgraph"
version = "0.1.0"
description = "Notebooks and example apps for LLMs with LangChain & LangGraph"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Michał Żarnecki" }]
license = { text = "MIT" }
keywords = ["llm", "langchain", "langgraph", "agents", "course", "notebooks"]

dependencies = [
    "python-dotenv>=1.1",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "langchain>=1.0,<2",
    "langchain-classic>=1.0,<2",
    "langchain-community>=0.3,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langchain-tavily>=0.2,<1",
    "langgraph>=1.0,<2",
    "langgraph-supervisor>=0.0.28",
    "langsmith>=0.4",
    "openai>=2.0",
    "pydantic>=2.11",
    "wikipedia>=1.4",
    "tavily-python>=0.5",
    "faiss-cpu>=1.9",
    "sentence-transformers>=3",
    "sqlite-vss>=0.1.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "sacrebleu>=2.5",
    "rouge-score>=0.1",
    "nltk>=3.8",
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.24,<2",
    "fastmcp>=2",
    "nest-asyncio>=1.6",
    "rapidfuzz>=3",
    "reportlab>=4",
    "scrapy>=2",
    "sec-api>=1",
    "umap-learn>=0.5",
    "scikit-learn>=1.5",
    "tiktoken>=0.8",
    "openbb>=4",
    "yfinance>=0.2",
    "boto3>=1",
    "requests>=2",
]

[project.optional-dependencies]
# Developer tools for editing and inspecting notebooks.
dev = [
"ruff>=0.6.0",
"nbmake>=1.5.3",
"nbqa>=1.9.1",
"nbdime>=4.0.2",
"jupytext>=1.16.0",
"pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "C4", "W"]
ignore = []

[tool.nbqa]
addopts = ["--nbqa-mutate"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.jupytext]
formats = "ipynb,py:percent"
