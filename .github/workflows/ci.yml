name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Install system dependencies (Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint Python
        run: uv run --no-sync ruff check . --extend-exclude 'exercises/**,**/*.ipynb'

      - name: Check notebook syntax and correctness
        run: uv run --no-sync ruff check notebooks --select F

      # imports every module used by the notebooks; needs no API keys
      - name: Import smoke test
        run: uv run --no-sync pytest tests/test_notebook_imports.py

      - name: Run notebooks with nbmake
        run: uv run --no-sync pytest --nbmake notebooks/**/*.ipynb -k "not expensive" || echo "No notebooks or tests"
