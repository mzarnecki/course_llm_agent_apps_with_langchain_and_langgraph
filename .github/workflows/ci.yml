name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_notebooks:
        description: "Execute notebooks with nbmake (needs API key secrets, calls paid APIs)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Install system dependencies (Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint Python
        run: uv run --no-sync ruff check . --extend-exclude 'exercises/**,**/*.ipynb'

      - name: Check notebook syntax and correctness
        run: uv run --no-sync ruff check notebooks --select F

      # imports every module used by the notebooks; needs no API keys
      - name: Import smoke test
        run: uv run --no-sync pytest tests/test_notebook_imports.py

      # notebooks call paid APIs and need key secrets, so they run only on a manual
      # "Run workflow" with run_notebooks checked; any failure fails the job
      - name: Run notebooks with nbmake
        if: inputs.run_notebooks
        run: uv run --no-sync pytest --nbmake notebooks/*/*.ipynb
